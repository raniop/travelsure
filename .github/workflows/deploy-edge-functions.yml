name: Deploy edge functions

# Deploys the Supabase edge functions changed in a push to main. Needs the GitHub secret
# SUPABASE_ACCESS_TOKEN; without it the run passes with a notice (Lovable deploys them instead).
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:
    inputs:
      functions:
        description: "Function names separated by spaces (empty = all)"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zhsfjwpwxjeysvstgsus
      INPUT_FUNCTIONS: ${{ github.event.inputs.functions }}
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - name: Missing token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::Add GitHub secret SUPABASE_ACCESS_TOKEN to auto-deploy edge functions."
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Deploy
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          if [ -n "$INPUT_FUNCTIONS" ]; then
            fns="$INPUT_FUNCTIONS"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            fns=$(ls supabase/functions)
          else
            fns=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- supabase/functions | cut -d/ -f3 | sort -u)
          fi
          for fn in $fns; do
            [ -f "supabase/functions/$fn/index.ts" ] || continue
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
