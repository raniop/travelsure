name: Deploy claim email functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/send-contact-email/**"
      - "supabase/functions/send-claim-email/**"
      - ".github/workflows/deploy-claim-email.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy send-contact-email
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy send-contact-email --project-ref zhsfjwpwxjeysvstgsus --no-verify-jwt
      - name: Deploy send-claim-email
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy send-claim-email --project-ref zhsfjwpwxjeysvstgsus --no-verify-jwt
      - name: Missing token
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo "Add GitHub secret SUPABASE_ACCESS_TOKEN to auto-deploy claim email functions."
          exit 0
