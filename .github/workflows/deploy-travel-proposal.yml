name: Deploy travel proposal function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/send-travel-proposal/**"
      - ".github/workflows/deploy-travel-proposal.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy send-travel-proposal
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy send-travel-proposal --project-ref zhsfjwpwxjeysvstgsus --no-verify-jwt
      - name: Missing token
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo "Add GitHub secret SUPABASE_ACCESS_TOKEN to auto-deploy send-travel-proposal."
          exit 0
