[build]
  base = "buyinsnew"
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Redirects for Next.js Image optimization with basePath
[[redirects]]
  from = "/buyinsnew/_next/image*"
  query = {url = ":url", w = ":width", q = ":quality"}
  to = "/.netlify/builders/_ipx"
  status = 200
  force = true
