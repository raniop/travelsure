<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="white"/>
  
  <!-- Wooden oval platform -->
  <defs>
    <pattern id="woodTexture" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#d97706"/>
      <circle cx="20" cy="20" r="3" fill="#92400e" opacity="0.3"/>
      <circle cx="80" cy="40" r="2" fill="#92400e" opacity="0.3"/>
      <circle cx="50" cy="70" r="2.5" fill="#92400e" opacity="0.3"/>
      <line x1="0" y1="50" x2="100" y2="50" stroke="#92400e" stroke-width="1" opacity="0.2"/>
    </pattern>
    <pattern id="redWhiteStripe" patternUnits="userSpaceOnUse" width="20" height="10">
      <rect width="10" height="10" fill="#dc2626"/>
      <rect x="10" width="10" height="10" fill="white"/>
    </pattern>
  </defs>
  
  <!-- Wooden oval platform -->
  <ellipse cx="600" cy="280" rx="500" ry="180" fill="url(#woodTexture)" opacity="0.9"/>
  <ellipse cx="600" cy="280" rx="500" ry="180" fill="none" stroke="#92400e" stroke-width="4" opacity="0.6"/>
  
  <!-- Group Figures (Left) - Green, Orange, Blue -->
  <!-- Green person -->
  <circle cx="280" cy="250" r="35" fill="#22c55e"/>
  <rect x="260" y="285" width="40" height="50" rx="20" fill="#22c55e"/>
  <!-- Orange person -->
  <circle cx="350" cy="240" r="35" fill="#ea580c"/>
  <rect x="330" y="275" width="40" height="50" rx="20" fill="#ea580c"/>
  <!-- Blue person -->
  <circle cx="420" cy="250" r="35" fill="#3b82f6"/>
  <rect x="400" y="285" width="40" height="50" rx="20" fill="#3b82f6"/>
  
  <!-- Flame Icon (Center) - Orange and Yellow -->
  <path d="M 550 200 L 570 180 L 590 200 L 580 220 L 600 240 L 580 260 L 560 240 L 550 220 Z" fill="#ea580c"/>
  <path d="M 560 210 L 580 190 L 590 210 L 585 225 L 595 240 L 585 250 L 570 235 L 560 220 Z" fill="#fbbf24"/>
  <path d="M 565 215 L 575 200 L 580 215 L 577 225 L 585 235 L 577 245 L 570 235 L 565 225 Z" fill="#fcd34d"/>
  
  <!-- Clipboard with checkmarks (Right) -->
  <rect x="720" y="200" width="50" height="70" rx="5" fill="#92400e"/>
  <rect x="725" y="205" width="40" height="60" fill="white"/>
  <!-- Three green checkmarks -->
  <path d="M 735 220 L 740 225 L 750 215" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="735" y1="230" x2="755" y2="230" stroke="#22c55e" stroke-width="2"/>
  <path d="M 735 240 L 740 245 L 750 235" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="735" y1="250" x2="755" y2="250" stroke="#22c55e" stroke-width="2"/>
  <path d="M 735 260 L 740 265 L 750 255" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Calculator (Right) -->
  <rect x="800" y="210" width="60" height="80" rx="5" fill="#4b5563"/>
  <rect x="810" y="220" width="40" height="15" fill="#1f2937"/>
  <text x="830" y="232" font-family="Arial, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">1.00</text>
  <!-- Calculator buttons -->
  <circle cx="820" cy="250" r="5" fill="#6b7280"/>
  <circle cx="840" cy="250" r="5" fill="#6b7280"/>
  <circle cx="820" cy="270" r="5" fill="#6b7280"/>
  <circle cx="840" cy="270" r="5" fill="#6b7280"/>
  
  <!-- Coin with ש (Shin) -->
  <circle cx="900" cy="250" r="25" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="900" y="260" font-family="Arial, sans-serif" font-size="28" fill="#92400e" text-anchor="middle" font-weight="bold">ש</text>
  
  <!-- Dark blue banner at bottom -->
  <rect x="0" y="450" width="1200" height="180" fill="#1e3a8a"/>
  <!-- Curved top of banner -->
  <path d="M 0 450 Q 0 440, 10 440 L 1190 440 Q 1200 440, 1200 450 L 1200 630 L 0 630 Z" fill="#1e3a8a"/>
  
  <!-- Red and white striped edges on banner curves -->
  <rect x="0" y="440" width="1200" height="10" fill="url(#redWhiteStripe)"/>
  
  <!-- Banner text: ניהול קבוצות ותשלומים -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle" direction="rtl">
    ניהול קבוצות ותשלומים
  </text>
  
  <!-- Calendar icon (Left of banner) -->
  <rect x="150" y="480" width="50" height="50" rx="5" fill="white" stroke="#dc2626" stroke-width="3"/>
  <line x1="150" y1="500" x2="200" y2="500" stroke="#dc2626" stroke-width="2"/>
  <!-- Red rings at top -->
  <circle cx="170" cy="490" r="3" fill="#dc2626"/>
  <circle cx="180" cy="490" r="3" fill="#dc2626"/>
  <!-- Green checkmark on calendar -->
  <circle cx="175" cy="510" r="8" fill="#22c55e"/>
  <path d="M 170 510 L 173 513 L 180 506" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Money/Banknotes (Center-right of banner) - Green banknotes -->
  <rect x="850" y="480" width="60" height="35" rx="3" fill="#22c55e" opacity="0.9" transform="rotate(-5 880 497)"/>
  <rect x="860" y="490" width="60" height="35" rx="3" fill="#22c55e" opacity="0.9" transform="rotate(3 890 507)"/>
  
  <!-- Stack of three golden coins -->
  <circle cx="950" cy="500" r="15" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <circle cx="950" cy="510" r="15" fill="#fbbf24" stroke="#d97706" stroke-width="2" opacity="0.8"/>
  <circle cx="950" cy="520" r="15" fill="#fbbf24" stroke="#d97706" stroke-width="2" opacity="0.6"/>
</svg>
