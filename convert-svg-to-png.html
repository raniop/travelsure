<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המרת SVG ל-PNG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            direction: rtl;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ea580c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c2410c;
        }
    </style>
</head>
<body>
    <h1>המרת SVG ל-PNG</h1>
    <p>לחץ על הכפתור כדי להמיר את ה-SVG ל-PNG ולהוריד אותו:</p>
    <button onclick="convertToPNG()">המר והורד PNG</button>
    <br>
    <canvas id="canvas" width="1200" height="630"></canvas>
    
    <script>
        async function convertToPNG() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            // Load SVG
            const svgResponse = await fetch('public/bbq-group-management.svg');
            const svgText = await svgResponse.text();
            
            // Create image from SVG
            const img = new Image();
            const svgBlob = new Blob([svgText], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                // Draw SVG on canvas
                ctx.drawImage(img, 0, 0);
                
                // Convert to PNG and download
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'bbq-group-management.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 'image/png');
            };
            
            img.src = url;
        }
    </script>
</body>
</html>
